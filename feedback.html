<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="stylelike.css">
    <script src="https://kit.fontawesome.com/d46469e7de.js" crossorigin="anonymous"></script>
</head>
<body>
    <form action="feedbackform.php" method="GET">
        <label id="head" for="Feedback">Provide your feedback:</label><br><br>
        <label for="Name">Name:</label>
        <input type="text" id="Name" placeholder="rasika"><br>
        <label for="opinion">Select your opinion</label>
        <select name="Opinion" id="opinion">
            <option value="Positive">Positive</option>
            <option value="Negative">Negative</option>
            <option value="Neutral">Neutral</option>
        </select>
        <br>
        <label for="Comment">Comment:</label>
        <textarea name="Comment" id="Comment" rows="3" cols="25"></textarea>
        <i class="fa-solid fa-thumbs-up" style="font-size: 70px;"></i><br>
        <input type="reset">
        <input type="submit">
    </form>
</body>
</html>
